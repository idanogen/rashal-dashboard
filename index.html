<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rashal-mark.png" />
    <link rel="apple-touch-icon" href="/rashal-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>דשבורד הזמנות | ר.שעל</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      🔴 מסך לבן בלי שום הסבר (15/09/2026, טאבלט אנדרואיד במשרד).
      סקריפט רגיל (לא module) שרץ לפני האפליקציה: אם הדפדפן ישן מדי, או
      שהאפליקציה נפלה לפני שציירה משהו, מוצג הסבר בעברית עם הפרטים שצריך
      כדי לאבחן מצילום (גרסת הדפדפן, השגיאה, שעון המכשיר). כשהאפליקציה
      עולה כרגיל, #root מתמלא והסקריפט לא עושה כלום.
    -->
    <script>
      (function () {
        var shown = false;
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        function rootEmpty() {
          var r = document.getElementById('root');
          return !r || r.children.length === 0;
        }
        function show(title, detail) {
          if (shown || !rootEmpty()) return;
          shown = true;
          var r = document.getElementById('root');
          r.innerHTML =
            '<div dir="rtl" style="font-family:Assistant,Arial,sans-serif;max-width:560px;margin:40px auto;padding:20px;border:1px solid #e3e8f0;border-radius:14px;background:#fff;color:#233044;line-height:1.6">' +
            '<h2 style="margin:0 0 8px;color:#14223a;font-size:20px">' + esc(title) + '</h2>' +
            '<p style="margin:0 0 12px">' + esc(detail) + '</p>' +
            '<button onclick="location.reload()" style="background:#0054b4;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px">רענון</button>' +
            '<div id="rashal-diag" style="margin-top:14px;font-size:12px;color:#5d6b82;direction:ltr;text-align:left;word-break:break-all"></div>' +
            '</div>';
          var d = document.getElementById('rashal-diag');
          var lines = ['Browser: ' + navigator.userAgent, 'Device time: ' + new Date().toString()];
          d.textContent = lines.join(' | ');
          // שעון מכשיר לא מכוון שובר את ההתחברות. משווים לשעת השרת.
          try {
            fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
              var h = res.headers.get('date');
              if (!h) return;
              var skewMin = Math.round((Date.now() - new Date(h).getTime()) / 60000);
              if (Math.abs(skewMin) >= 5) {
                d.textContent = lines.join(' | ') + ' | Clock skew: ' + skewMin + ' min';
                var p = document.createElement('p');
                p.style.cssText = 'margin:10px 0 0;color:#b91c1c;font-weight:700;direction:rtl;text-align:right';
                p.textContent = 'השעון במכשיר לא מכוון (הפרש של ' + Math.abs(Math.round(skewMin / 60)) + ' שעות). יש להגדיר תאריך ושעה אוטומטיים ואזור זמן ישראל.';
                d.parentNode.insertBefore(p, d);
              }
            });
          } catch (e) {}
        }
        // דפדפן ישן: האפליקציה משתמשת ב-??= וב-Object.hasOwn (Chrome 93 ומעלה).
        var modern = typeof Object.hasOwn === 'function';
        try { new Function('var a; a ??= 1;'); } catch (e) { modern = false; }
        if (!modern) {
          window.addEventListener('DOMContentLoaded', function () {
            show('הדפדפן במכשיר הזה ישן מדי למערכת', 'צריך לעדכן את Chrome מחנות Google Play (או להשתמש בדפדפן אחר מעודכן), ואז לרענן.');
          });
        }
        window.addEventListener('error', function (ev) {
          setTimeout(function () {
            show('המערכת לא הצליחה לעלות במכשיר הזה', 'שגיאה: ' + (ev && ev.message ? ev.message : 'לא ידועה') + '. נסו לרענן. אם זה חוזר, צלמו את המסך הזה ושלחו.');
          }, 300);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          setTimeout(function () {
            var m = ev && ev.reason ? (ev.reason.message || ev.reason) : 'לא ידועה';
            show('המערכת לא הצליחה לעלות במכשיר הזה', 'שגיאה: ' + m + '. נסו לרענן. אם זה חוזר, צלמו את המסך הזה ושלחו.');
          }, 300);
        });
        // רשת איטית או משהו שלא נתפס: אחרי 20 שניות בלי כלום על המסך.
        setTimeout(function () {
          show('המערכת עדיין לא עלתה', 'ייתכן שהחיבור לאינטרנט איטי או שהדפדפן חסם את הטעינה. נסו לרענן. אם זה חוזר, צלמו את המסך הזה ושלחו.');
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
